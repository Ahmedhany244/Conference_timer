<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login - Conference Timer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        max-width: 450px;
        width: 100%;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header h1 {
        color: #2c3e50;
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        color: #7f8c8d;
        font-size: 1.1em;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2c3e50;
        font-size: 1.1em;
      }

      .form-group input {
        width: 100%;
        padding: 15px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 1em;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      }

      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1.1em;
        margin: 10px 0;
        transition: all 0.3s ease;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-primary {
        background: linear-gradient(135deg, #3498db, #2980b9);
        color: white;
      }

      .response {
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        display: none;
        text-align: center;
      }

      .success {
        background: #d4edda;
        color: #155724;
        border: 2px solid #c3e6cb;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        border: 2px solid #f5c6cb;
      }

      .quick-login {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
      }

      .quick-login h4 {
        color: #2c3e50;
        margin-bottom: 15px;
        text-align: center;
      }

      .quick-login-btn {
        background: #17a2b8;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
        font-size: 0.9em;
        transition: background 0.3s ease;
      }

      .quick-login-btn:hover {
        background: #138496;
      }

      .links {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e9ecef;
      }

      .links a {
        color: #3498db;
        text-decoration: none;
        margin: 0 15px;
        font-weight: 500;
      }

      .links a:hover {
        text-decoration: underline;
      }

      .user-type-badge {
        background: linear-gradient(135deg, #3498db, #2980b9);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 20px;
      }

      .dashboard-options {
        display: none;
        background: #d4edda;
        border: 2px solid #c3e6cb;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
        text-align: center;
      }

      .dashboard-btn {
        background: #28a745;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 8px;
        font-size: 1em;
        text-decoration: none;
        display: inline-block;
        transition: background 0.3s ease;
      }

      .dashboard-btn:hover {
        background: #218838;
        text-decoration: none;
        color: white;
      }

      @media (max-width: 768px) {
        .login-container {
          padding: 30px 20px;
          margin: 10px;
        }

        .header h1 {
          font-size: 2em;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <!-- Header -->
      <div class="header">
        <div class="user-type-badge">👤 Conference Attendee</div>
        <h1>Welcome Back</h1>
        <p>Login to access your conference dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email address"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          🔑 Login
        </button>
      </form>

      <!-- Response Message -->
      <div id="responseMessage" class="response"></div>

      <!-- Dashboard Options (shown after successful login) -->
      <div id="dashboardOptions" class="dashboard-options">
        <h4>🎉 Login Successful! Choose your next action:</h4>
        <a href="/qr-test.html" class="dashboard-btn">📱 Generate QR Code</a>
        <a href="/timer-display.html" class="dashboard-btn">⏱️ View My Timer</a>
      </div>

      <!-- Quick Login for Testing -->
      <div class="quick-login">
        <h4>🧪 Quick Login (Testing)</h4>
        <button
          type="button"
          class="quick-login-btn"
          onclick="quickLogin('test@example.com', 'password')"
        >
          User 1 (test@example.com)
        </button>
        <button
          type="button"
          class="quick-login-btn"
          onclick="quickLogin('john@example.com', 'password123')"
        >
          User 2 (john@example.com)
        </button>
      </div>

      <!-- Links -->
      <div class="links">
        <a href="/user-register.html">Don't have an account? Register</a>
        <br /><br />
        <a href="/admin-login.html">Login as Administrator</a>
        |
        <a href="/index.html">Back to Home</a>
      </div>
    </div>

    <script>
      let authToken = "";
      let currentUser = null;

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          await performLogin();
        });

      async function performLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const loginBtn = document.getElementById("loginBtn");

        // Disable button during login
        loginBtn.disabled = true;
        loginBtn.textContent = "🔄 Logging in...";

        try {
          const response = await fetch("/auth/signin", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            authToken = data.token;
            currentUser = { email, role: data.role };

            // Store in session storage for other pages
            sessionStorage.setItem("authToken", authToken);
            sessionStorage.setItem("userEmail", email);
            sessionStorage.setItem("userRole", data.role);

            showResponse(`🎉 Welcome back! Login successful.`, "success");

            // Show dashboard options
            document.getElementById("dashboardOptions").style.display = "block";

            // Hide login form
            document.getElementById("loginForm").style.display = "none";
          } else {
            showResponse(
              `❌ Login failed: ${data.message || "Invalid credentials"}`,
              "error"
            );
          }
        } catch (error) {
          showResponse(
            `❌ Network error: ${error.message}. Please check your connection.`,
            "error"
          );
        } finally {
          // Re-enable button
          loginBtn.disabled = false;
          loginBtn.textContent = "🔑 Login";
        }
      }

      // Quick login function for testing
      async function quickLogin(email, password) {
        document.getElementById("email").value = email;
        document.getElementById("password").value = password;
        await performLogin();
      }

      function showResponse(message, type) {
        const responseElement = document.getElementById("responseMessage");
        responseElement.textContent = message;
        responseElement.className = `response ${type}`;
        responseElement.style.display = "block";

        // Hide error messages after 6 seconds
        if (type === "error") {
          setTimeout(() => {
            responseElement.style.display = "none";
          }, 6000);
        }
      }

      // Check if user is already logged in
      window.addEventListener("load", function () {
        const storedToken = sessionStorage.getItem("authToken");
        const storedEmail = sessionStorage.getItem("userEmail");

        if (storedToken && storedEmail) {
          authToken = storedToken;
          showResponse(
            `👋 Welcome back, ${storedEmail}! You're already logged in.`,
            "success"
          );
          document.getElementById("dashboardOptions").style.display = "block";
          document.getElementById("loginForm").style.display = "none";
        }
      });
    </script>
  </body>
</html>
